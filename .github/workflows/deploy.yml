# Builds what wohnpilot.codekorb.de/httpdocs needs and commits it to the
# branch "deploy", which Plesk pulls into httpdocs (document root: public/).
#
#   deploy branch = public/ (built app + index.php), src/, bin/, vendor/ (no dev
#   packages), composer.*, var/.htaccess
#
# .env and the data in var/ live only on the server and are never part of it.
# Nothing is deployed unless the tests pass.

name: Deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, openssl, pdo_sqlite, sodium
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit

      - name: Frontend checks and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run check
          npm run build

      - name: Stage the server folder
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          rsync -a backend/ "$stage/" \
            --exclude /tests --exclude /var --exclude /vendor --exclude /.phpunit.cache \
            --exclude /phpunit.xml --exclude /.env
          (cd "$stage" && composer install --no-dev --optimize-autoloader --no-interaction --no-progress)
          mkdir -p "$stage/var"
          printf 'Require all denied\n' > "$stage/var/.htaccess"
          for built in index.html sw.js push-sw.js manifest.webmanifest assets; do
            test -e "$stage/public/$built" || { echo "Build incomplete: public/$built is missing"; exit 1; }
          done

      - name: Commit to the deploy branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$RUNNER_TEMP/deploy"
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git fetch --depth=1 origin deploy
            git worktree add -B deploy "$tree" origin/deploy
          else
            git worktree add --orphan -b deploy "$tree"
          fi
          find "$tree" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/stage/." "$tree/"
          cd "$tree"
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -q -m "Deploy ${GITHUB_SHA::7}: $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s)"
          git push origin deploy
