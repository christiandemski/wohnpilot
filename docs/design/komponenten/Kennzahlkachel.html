<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-ui)}
.tile{width:173px;box-sizing:border-box;background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center}
.ic{display:flex;width:36px;height:36px;border-radius:var(--radius-xs);background:var(--module-zaehler-tint);color:var(--module-zaehler-ink);align-items:center;justify-content:center}
.trend{font-size:12px;font-weight:600;color:var(--ok)}
.lbl{font-size:13px;color:var(--ink-muted)}
.num{font-family:var(--font-num);font-size:30px;line-height:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.unit{font-size:14px;color:var(--ink-muted)}
.past{fill:var(--line)}
.now{fill:var(--accent)}
</style>
</head>
<body>
<a class="tile" href="#">
<span class="top"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span><span class="trend">−8 %</span></span>
<span style="display:flex;flex-direction:column"><span class="lbl">Strom Oktober</span><span style="display:flex;align-items:baseline;gap:4px"><span class="num">246</span><span class="unit">kWh</span></span></span>
<svg role="img" aria-label="Letzte sechs Monate, Oktober leicht über September" width="100%" height="32" viewBox="0 0 132 32" preserveAspectRatio="none" style="display:block"><rect class="past" x="0" y="12" width="16" height="20" rx="4"/><rect class="past" x="23" y="16" width="16" height="16" rx="4"/><rect class="past" x="46" y="17" width="16" height="15" rx="4"/><rect class="past" x="69" y="15" width="16" height="17" rx="4"/><rect class="past" x="92" y="13" width="16" height="19" rx="4"/><rect class="now" x="115" y="11" width="17" height="21" rx="4"/></svg>
</a>
</body>
</html>
