<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-ui)}
nav{max-width:358px;height:var(--tabbar-height);border-radius:var(--radius-full);background:var(--inverse);display:flex;align-items:center;padding:0 var(--space-2);box-shadow:var(--shadow-tabbar)}
a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;min-width:var(--touch-min);color:var(--on-inverse-muted);text-decoration:none;font-size:11px;line-height:14px;font-weight:600}
.icon{display:flex;align-items:center;justify-content:center;width:48px;height:28px;border-radius:var(--radius-full)}
a[aria-current]{color:var(--on-inverse)}
a[aria-current] .icon{background:color-mix(in srgb,var(--on-inverse) 16%,transparent)}
.plus{gap:0;color:var(--on-inverse)}
.fab{display:flex;align-items:center;justify-content:center;width:var(--fab);height:var(--fab);border-radius:var(--radius-full);background:var(--accent);color:var(--on-accent)}
a:focus-visible{outline:2px solid var(--on-inverse);outline-offset:-2px;border-radius:var(--radius-sm)}
</style>
</head>
<body>
<nav aria-label="Hauptnavigation">
<a href="#" aria-current="page"><span class="icon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></span>Übersicht</a>
<a href="#"><span class="icon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg></span>Zähler</a>
<a class="plus" href="#"><span class="fab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Erfassen</a>
<a href="#"><span class="icon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>Zuhause</a>
<a href="#"><span class="icon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>Mehr</a>
</nav>
</body>
</html>
