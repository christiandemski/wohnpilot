<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-ui)}
nav{max-width:358px;height:var(--tabbar-height);border-radius:var(--radius-full);background:var(--inverse);display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-shadow:var(--shadow-tabbar)}
.active{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-radius:24px;background:var(--on-inverse);color:var(--inverse);text-decoration:none;font-size:13px;font-weight:600}
.tab{display:flex;align-items:center;justify-content:center;width:48px;height:48px;color:var(--on-inverse-muted)}
.plus{display:flex;align-items:center;justify-content:center;width:var(--fab);height:var(--fab);border-radius:var(--radius-full);background:var(--accent);color:var(--on-accent)}
a:focus-visible{outline:2px solid var(--on-inverse);outline-offset:2px;border-radius:24px}
</style>
</head>
<body>
<nav aria-label="Hauptnavigation">
<a class="active" href="#" aria-current="page"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Übersicht</a>
<a class="tab" href="#" aria-label="Zuhause"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
<a class="plus" href="#" aria-label="Eintrag hinzufügen"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
<a class="tab" href="#" aria-label="Suche"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
<a class="tab" href="#" aria-label="Mehr"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></a>
</nav>
</body>
</html>
