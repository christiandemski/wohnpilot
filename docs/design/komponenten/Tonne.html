<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-ui)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;width:60px}
.tile{display:flex;width:52px;height:52px;border-radius:var(--radius-sm);background:var(--surface);align-items:center;justify-content:center}
.lbl{font-size:12px;font-weight:600;text-align:center}
.lid,.body{stroke:var(--ink);stroke-width:1.25;stroke-linejoin:round}
.groove{stroke:var(--ink);stroke-width:1.25;stroke-linecap:round}
.rest{fill:var(--bin-rest)}.bio{fill:var(--bin-bio)}.papier{fill:var(--bin-papier)}.gelb{fill:var(--bin-gelb)}.glas{fill:var(--bin-glas)}
</style>
</head>
<body>
<div class="row">
<span class="item"><span class="tile"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><rect class="lid rest" x="3.5" y="4" width="17" height="3.5" rx="1.25"/><path class="body rest" d="M5.5 8.5h13l-1.3 11.1a1.5 1.5 0 0 1-1.5 1.4H8.3a1.5 1.5 0 0 1-1.5-1.4z"/><path class="groove" d="M10 11.5v6M14 11.5v6"/></svg></span><span class="lbl">Restmüll</span></span>
<span class="item"><span class="tile"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><rect class="lid bio" x="3.5" y="4" width="17" height="3.5" rx="1.25"/><path class="body bio" d="M5.5 8.5h13l-1.3 11.1a1.5 1.5 0 0 1-1.5 1.4H8.3a1.5 1.5 0 0 1-1.5-1.4z"/><path class="groove" d="M10 11.5v6M14 11.5v6"/></svg></span><span class="lbl">Bio</span></span>
<span class="item"><span class="tile"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><rect class="lid papier" x="3.5" y="4" width="17" height="3.5" rx="1.25"/><path class="body papier" d="M5.5 8.5h13l-1.3 11.1a1.5 1.5 0 0 1-1.5 1.4H8.3a1.5 1.5 0 0 1-1.5-1.4z"/><path class="groove" d="M10 11.5v6M14 11.5v6"/></svg></span><span class="lbl">Papier</span></span>
<span class="item"><span class="tile"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><rect class="lid gelb" x="3.5" y="4" width="17" height="3.5" rx="1.25"/><path class="body gelb" d="M5.5 8.5h13l-1.3 11.1a1.5 1.5 0 0 1-1.5 1.4H8.3a1.5 1.5 0 0 1-1.5-1.4z"/><path class="groove" d="M10 11.5v6M14 11.5v6"/></svg></span><span class="lbl">Gelbe Tonne</span></span>
<span class="item"><span class="tile"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24"><rect class="lid glas" x="3.5" y="4" width="17" height="3.5" rx="1.25"/><path class="body glas" d="M5.5 8.5h13l-1.3 11.1a1.5 1.5 0 0 1-1.5 1.4H8.3a1.5 1.5 0 0 1-1.5-1.4z"/><path class="groove" d="M10 11.5v6M14 11.5v6"/></svg></span><span class="lbl">Glas</span></span>
</div>
</body>
</html>
