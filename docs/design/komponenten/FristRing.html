<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-ui)}
.row{display:flex;gap:12px}
.tile{width:173px;box-sizing:border-box;background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.ring{position:relative;width:64px;height:64px}
.track{fill:none;stroke:var(--paper);stroke-width:8}
.arc{fill:none;stroke-width:8;stroke-linecap:round}
.soon{stroke:var(--soon)}
.due{stroke:var(--due)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.n{font-family:var(--font-num);font-size:20px;font-weight:600;line-height:1}
.u{font-size:10px;color:var(--ink-muted)}
.t{font-size:15px;font-weight:600}
</style>
</head>
<body>
<div class="row">
<a class="tile" href="#">
<span class="ring"><svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27"/><circle class="arc soon" cx="32" cy="32" r="27" stroke-dasharray="132 170" transform="rotate(-90 32 32)"/></svg><span class="center"><span class="n">9</span><span class="u">Tage</span></span></span>
<span style="display:flex;flex-direction:column;gap:2px"><span class="t">Strom kündigen?</span><span style="font-size:13px;font-weight:500;color:var(--soon-text)">bis 02.11.</span></span>
</a>
<a class="tile" href="#">
<span class="ring"><svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27"/><circle class="arc due" cx="32" cy="32" r="27" stroke-dasharray="170 170" transform="rotate(-90 32 32)"/></svg><span class="center"><span class="n">0</span><span class="u">Tage</span></span></span>
<span style="display:flex;flex-direction:column;gap:2px"><span class="t">Hausrat prüfen</span><span style="font-size:13px;font-weight:500;color:var(--due)">heute fällig</span></span>
</a>
</div>
</body>
</html>
