<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-ui)}
.seg{max-width:358px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--line);border-radius:var(--radius-full);padding:4px}
.seg button{min-height:40px;border:0;border-radius:var(--radius-full);background:transparent;font-family:var(--font-ui);font-size:14px;font-weight:500;color:var(--ink-muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
</style>
</head>
<body>
<div class="seg" role="tablist" aria-label="Zeitraum">
<button type="button" role="tab" aria-selected="true">Monate</button>
<button type="button" role="tab" aria-selected="false">Jahre</button>
<button type="button" role="tab" aria-selected="false">Kosten</button>
</div>
</body>
</html>
