<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-ui)}
.card{max-width:358px;box-sizing:border-box;background:var(--inverse);color:var(--on-inverse);border-radius:var(--radius-xl);padding:var(--space-5);display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:13px;font-weight:500;color:var(--on-inverse-muted)}
.chip{font-size:12px;font-weight:600;color:var(--due-on-inverse);background:rgba(229,72,77,.2);border-radius:var(--radius-full);padding:5px 10px}
.title{font-size:24px;line-height:29px;font-weight:700;letter-spacing:-.01em}
.meta{font-size:14px;color:var(--on-inverse-muted)}
.cta{min-height:var(--button-height);border-radius:var(--radius-full);background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.cta:focus-visible{outline:2px solid var(--on-inverse);outline-offset:2px}
</style>
</head>
<body>
<section class="card">
<div class="top"><span class="eyebrow">Als Nächstes</span><span class="chip">Überfällig · 2 Tage</span></div>
<div style="display:flex;flex-direction:column;gap:4px"><span class="title">Zählerstände ablesen</span><span class="meta">4 Zähler · Keller und Garten · ca. 3 Minuten</span></div>
<a class="cta" href="#">Ablese-Runde starten<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</section>
</body>
</html>
