<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-ui)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;line-height:16px;font-weight:600;border-radius:var(--radius-full);padding:5px 10px}
</style>
</head>
<body>
<div class="row">
<span class="chip" style="background:var(--due-tint);color:var(--due)">Überfällig · 2 Tage</span>
<span class="chip" style="background:var(--soon-tint);color:var(--soon-text)">noch 9 Tage</span>
<span class="chip" style="background:var(--ok-tint);color:var(--ok)">Heute erfasst</span>
<span class="chip" style="background:var(--module-zaehler-tint);color:var(--module-zaehler-ink)">Zähler · Keller</span>
<span class="chip" style="background:var(--paper);color:var(--ink)">Di 27.</span>
</div>
</body>
</html>
